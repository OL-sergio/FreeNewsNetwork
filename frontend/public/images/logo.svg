<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="0" y="0" width="400" height="120" rx="12" ry="12" fill="url(#bgGrad)"/>

  <!-- Globe / broadcast icon -->
  <g transform="translate(28, 18)">
    <!-- Globe circle -->
    <circle cx="42" cy="42" r="34" fill="none" stroke="#e94560" stroke-width="2.5"/>
    <!-- Globe horizontal lines -->
    <ellipse cx="42" cy="42" rx="34" ry="14" fill="none" stroke="#e94560" stroke-width="1.5"/>
    <line x1="42" y1="8" x2="42" y2="76" stroke="#e94560" stroke-width="1.5"/>
    <line x1="8" y1="42" x2="76" y2="42" stroke="#e94560" stroke-width="1.5"/>
    <!-- Globe vertical ellipse -->
    <ellipse cx="42" cy="42" rx="14" ry="34" fill="none" stroke="#e94560" stroke-width="1.5"/>

    <!-- Broadcast waves (top-right) -->
    <path d="M 64 16 Q 78 10, 80 24" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 68 10 Q 86 2, 90 20" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 72 4 Q 94 -6, 100 16" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- "FREE" text -->
  <text x="138" y="42" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="22" fill="#e94560" letter-spacing="3">FREE</text>

  <!-- "NEWS" text -->
  <text x="138" y="72" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="30" fill="#ffffff" letter-spacing="4">NEWS</text>

  <!-- "NETWORK" text -->
  <text x="138" y="96" font-family="'Arial', 'Helvetica Neue', sans-serif" font-weight="400" font-size="16" fill="#8899aa" letter-spacing="8">NETWORK</text>

  <!-- Red accent bar -->
  <rect x="130" y="48" width="250" height="3" rx="1.5" fill="url(#accentGrad)" opacity="0.8"/>

  <!-- Breaking news ticker line at bottom -->
  <rect x="0" y="112" width="400" height="8" rx="0" ry="0" fill="#e94560"/>
</svg>
